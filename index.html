<!DOCTYPE html>
<html>
<head>
<title>Airtel Fiber Premium</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#fff;
    color:#222;
}

header{
    background:#e60000;
    color:white;
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:28px;
    font-weight:bold;
}

button{
    background:#e60000;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:25px;
    cursor:pointer;
}

.hero{
    background:linear-gradient(120deg,#111,#e60000);
    color:white;
    text-align:center;
    padding:60px 20px;
}

.hero h1{
    font-size:40px;
}

.animation{
    font-size:60px;
    animation:move 2s infinite alternate;
}

@keyframes move{
    from{transform:translateY(0);}
    to{transform:translateY(-20px);}
}

.section{
    padding:40px 20px;
    text-align:center;
}

.cards{
    display:flex;
    gap:20px;
    justify-content:center;
    flex-wrap:wrap;
}

.card{
    width:260px;
    padding:25px;
    border-radius:20px;
    box-shadow:0 5px 20px #ccc;
    background:white;
}

.card h2{
    color:#e60000;
}

.video iframe{
    width:90%;
    height:350px;
    border-radius:15px;
}

footer{
    background:#111;
    color:white;
    text-align:center;
    padding:20px;
}
</style>

</head>

<body>

<header>
<div class="logo">Airtel Fiber</div>
<button>Get Connection</button>
</header>


<section class="hero">

<div class="animation">📡</div>

<p>Fast
